<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบบริการแบบฟอร์มคำขอ - ศูนย์ราชการสะดวก (Government Easy Contact Center)</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #f8fafc;
      font-family: 'Sarabun', sans-serif, system-ui;
      overflow-x: hidden;
    }
    #loading-screen {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100vh; color: #581c87; gap: 14px;
    }
    .spinner {
      width: 44px; height: 44px; border: 4px solid #e9d5ff;
      border-top-color: #6b21a8; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    iframe, .content-container {
      width: 100% !important;
      height: 100% !important;
      border: none;
    }
  </style>
</head>
<body>
  <div id="loading-screen">
    <div class="spinner"></div>
    <div style="font-weight: bold; font-size: 16px;">กำลังโหลดระบบบริการแบบฟอร์มคำขอ...</div>
  </div>

  <script>
    const GAS_EXEC_URL = "https://script.google.com/macros/s/AKfycbzVp7J3B0Pm1hBi8h-fZHX4qMjgUrOac5JmombOwKZ9tJ_GXdmJ1ZvOcp7pN_dnJY90xw/exec";

    if (window.self !== window.top && !window.location.search.includes('mode=kiosk')) {
      const newUrl = window.location.pathname + (window.location.search ? window.location.search + '&mode=kiosk' : '?mode=kiosk');
      window.history.replaceState(null, '', newUrl);
    }

    const gasBridgeScript = `
      <script>
        window.GAS_EXEC_URL = "${GAS_EXEC_URL}";
        function createGasRunner(successHandler, failureHandler) {
          const callServer = function(action, args) {
            fetch(window.GAS_EXEC_URL, {
              method: "POST",
              credentials: "omit",
              body: JSON.stringify({ action: action, args: args })
            })
            .then(function(r) { return r.json(); })
            .then(function(res) { if (successHandler) successHandler(res); })
            .catch(function(err) { if (failureHandler) failureHandler(err); });
          };
          return new Proxy({}, {
            get: function(target, prop) {
              if (prop === "withSuccessHandler") return function(fn) { return createGasRunner(fn, failureHandler); };
              if (prop === "withFailureHandler") return function(fn) { return createGasRunner(successHandler, fn); };
              if (typeof prop === "symbol" || prop === "then") return undefined;
              return function() {
                var args = Array.prototype.slice.call(arguments);
                callServer(String(prop), args);
              };
            }
          });
        }
        window.google = { script: { run: createGasRunner(null, null) } };
      <\/script>
    `;

    fetch(GAS_EXEC_URL, {
      method: "POST",
      credentials: "omit",
      body: JSON.stringify({ action: "getHtml" })
    })
    .then(r => r.json())
    .then(res => {
      if (res.success && res.html) {
        let finalHtml = res.html;
        if (!finalHtml.includes('viewport')) {
          finalHtml = finalHtml.replace("<head>", "<head><meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">");
        }
        finalHtml = finalHtml.replace("<head>", "<head>" + gasBridgeScript);

        document.open();
        document.write(finalHtml);
        document.close();
      } else {
        document.getElementById("loading-screen").innerHTML = "<p style='color:red;'>ไม่สามารถโหลดหน้าเว็บได้: " + (res.message || "") + "</p>";
      }
    })
    .catch(err => {
      document.getElementById("loading-screen").innerHTML = "<p style='color:red;'>การเชื่อมต่อขัดข้อง กรุณารีเฟรชหน้าเว็บอีกครั้ง</p>";
    });
  </script>
</body>
</html>
