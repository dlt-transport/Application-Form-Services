<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบบริการแบบฟอร์มคำขอ - กรมการขนส่งทางบก</title>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #f8fafc; font-family: sans-serif; }
    #loading-screen {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100vh; color: #581c87; gap: 14px;
    }
    .spinner {
      width: 44px; height: 44px; border: 4px solid #e9d5ff;
      border-top-color: #6b21a8; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading-screen">
    <div class="spinner"></div>
    <div style="font-weight: bold; font-size: 16px;">กำลังโหลดระบบบริการแบบฟอร์มคำขอ...</div>
  </div>

  <script>
    // ลิงก์ Web App (/exec) ของคุณ (ไม่มี /u/1/)
    const GAS_EXEC_URL = "https://script.google.com/macros/s/AKfycbzVp7J3B0Pm1hBi8h-fZHX4qMjgUrOac5JmombOwKZ9tJ_GXdmJ1ZvOcp7pN_dnJY90xw/exec";

    // หากถูกฝังอยู่ในหน้าตู้น้องนำทาง (Ai-Digital-Kiosk) ให้เติม ?mode=kiosk อัตโนมัติ
    if (window.self !== window.top && !window.location.search.includes('mode=kiosk')) {
      const newUrl = window.location.pathname + (window.location.search ? window.location.search + '&mode=kiosk' : '?mode=kiosk');
      window.history.replaceState(null, '', newUrl);
    }

    // สคริปต์จำลอง google.script.run ที่ตัดคุกกี้บัญชี Google ทิ้ง 100% (credentials: 'omit')
    const gasBridgeScript = `
      <script>
        window.GAS_EXEC_URL = "${GAS_EXEC_URL}";
        function createGasRunner(successHandler, failureHandler) {
          const callServer = (action, args) => {
            fetch(window.GAS_EXEC_URL, {
              method: "POST",
              credentials: "omit",
              body: JSON.stringify({ action: action, args: args })
            })
            .then(r => r.json())
            .then(res => { if (successHandler) successHandler(res); })
            .catch(err => { if (failureHandler) failureHandler(err); });
          };
          return {
            withSuccessHandler: (fn) => createGasRunner(fn, failureHandler),
            withFailureHandler: (fn) => createGasRunner(successHandler, fn),
            extractIdCardData: (...args) => callServer("extractIdCardData", args),
            extractVehicleData: (...args) => callServer("extractVehicleData", args),
            generateStatelessPDF: (...args) => callServer("generateStatelessPDF", args)
          };
        }
        window.google = { script: { run: createGasRunner(null, null) } };
      <\/script>
    `;

    // ดึงหน้าเว็บแบบฟอร์มโดยไม่ส่งคุกกี้บัญชี Google (credentials: 'omit')
    fetch(GAS_EXEC_URL, {
      method: "POST",
      credentials: "omit",
      body: JSON.stringify({ action: "getHtml" })
    })
    .then(r => r.json())
    .then(res => {
      if (res.success && res.html) {
        const finalHtml = res.html.replace("<head>", "<head>" + gasBridgeScript);
        document.open();
        document.write(finalHtml);
        document.close();
      } else {
        document.getElementById("loading-screen").innerHTML = "<p style='color:red;'>ไม่สามารถโหลดหน้าเว็บได้: " + (res.message || "") + "</p>";
      }
    })
    .catch(err => {
      document.getElementById("loading-screen").innerHTML = "<p style='color:red;'>การเชื่อมต่อขัดข้อง กรุณารีเฟรชหน้าเว็บอีกครั้ง</p>";
    });
  </script>
</body>
</html>
